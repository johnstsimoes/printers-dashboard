# Printer farm dashboard at /dalavini/ on an existing nginx site.
# Paste these blocks inside your existing `server { ... }` block (the HTTPS one),
# or save this file as /etc/nginx/snippets/dalavini.conf and add
#     include snippets/dalavini.conf;
# to that server block.
# The Node app should run with HOST=127.0.0.1 PORT=3000 (change the port below if 3000 is taken).

# The page uses relative URLs, so it must be loaded with the trailing slash.
location = /dalavini {
    return 301 /dalavini/;
}

location /dalavini/ {
    auth_basic "Printer Farm";
    auth_basic_user_file /etc/nginx/.htpasswd-printerfarm;

    # Trailing slash strips the /dalavini prefix before passing to the app.
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Server-sent events: long-lived, unbuffered, uncompressed.
location = /dalavini/events {
    auth_basic "Printer Farm";
    auth_basic_user_file /etc/nginx/.htpasswd-printerfarm;

    proxy_pass http://127.0.0.1:3000/events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
}
